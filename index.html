:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;

  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;div id=&quot;paper-typing-lab&quot;&gt;
  &lt;style&gt;
    #paper-typing-lab {
      display: grid;
      gap: 1rem;
      width: 100%;
      color: var(--foreground);
      background: transparent;
    }

    #paper-typing-lab .lab-shell {
      position: relative;
      display: grid;
      gap: 1rem;
      border-radius: 0.75rem;
      outline: 2px solid transparent;
      outline-offset: 0.35rem;
      transition: outline-color 160ms ease;
      overflow: hidden;
    }

    #paper-typing-lab .lab-shell.is-dragging {
      outline-color: var(--primary);
    }

    #paper-typing-lab .toolbar {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      justify-content: space-between;
    }

    #paper-typing-lab .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: end;
    }

    #paper-typing-lab .slider-field {
      min-width: 12rem;
      display: grid;
      gap: 0.35rem;
    }

    #paper-typing-lab .workspace {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(16rem, 0.95fr);
      gap: 1rem;
      align-items: start;
    }

    #paper-typing-lab .manuscript {
      display: grid;
      gap: 0.85rem;
      max-height: min(68vh, 46rem);
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    #paper-typing-lab .manuscript-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: baseline;
      justify-content: space-between;
    }

    #paper-typing-lab .paper-meta {
      display: grid;
      gap: 0.2rem;
      justify-items: center;
      text-align: center;
    }

    #paper-typing-lab .paper-authors {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--muted-foreground);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #paper-typing-lab .paper-meta-note {
      font-size: 0.82rem;
      color: var(--muted-foreground);
    }

    #paper-typing-lab .paper-sections {
      display: grid;
      gap: 0.85rem;
    }

    #paper-typing-lab .section {
      display: grid;
      gap: 0.4rem;
      padding-left: 0.85rem;
      border-left: 1px solid var(--border);
      transition:
        border-color 180ms ease,
        background 180ms ease,
        opacity 180ms ease;
    }

    #paper-typing-lab .section.is-active {
      border-left-color: var(--primary);
      background: color-mix(in oklab, var(--primary) 8%, transparent);
    }

    #paper-typing-lab .section.is-done {
      opacity: 0.82;
    }

    #paper-typing-lab .section-heading {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    #paper-typing-lab .section-mark {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      background: var(--muted-foreground);
      flex: 0 0 auto;
    }

    #paper-typing-lab .section.is-active .section-mark {
      background: var(--primary);
    }

    #paper-typing-lab .section.is-done .section-mark {
      background: var(--secondary);
    }

    #paper-typing-lab .section-body {
      min-height: 2.5rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #paper-typing-lab .manuscript.is-pdf {
      position: relative;
      padding: 1.2rem;
      border: 1px solid color-mix(in oklab, var(--border) 80%, var(--foreground) 20%);
      border-radius: 0.8rem;
      background:
        linear-gradient(180deg, color-mix(in oklab, var(--background) 97%, #f5efe6 3%), color-mix(in oklab, var(--background) 92%, #f5efe6 8%));
      box-shadow: 0 14px 34px color-mix(in oklab, var(--foreground) 10%, transparent);
    }

    #paper-typing-lab .manuscript.is-pdf::before {
      content: &quot;&quot;;
      position: absolute;
      top: 4.5rem;
      bottom: 1rem;
      left: 2.05rem;
      width: 1px;
      background: color-mix(in oklab, var(--primary) 35%, transparent);
      opacity: 0.42;
      pointer-events: none;
    }

    #paper-typing-lab .manuscript.is-pdf .manuscript-head {
      border-bottom: 1px solid color-mix(in oklab, var(--border) 75%, transparent);
      padding-bottom: 0.45rem;
    }

    #paper-typing-lab .manuscript.is-pdf h2 {
      text-align: center;
      margin: 0.15rem 0 0.05rem;
      font-size: 1.5rem;
      line-height: 1.25;
    }

    #paper-typing-lab .manuscript.is-pdf .paper-sections {
      gap: 1rem;
    }

    #paper-typing-lab .manuscript.is-pdf .paper-meta {
      padding: 0.2rem 1rem 0.5rem;
    }

    #paper-typing-lab .manuscript.is-pdf .section {
      padding: 0.85rem 1rem 0.9rem;
      border-left: 3px solid color-mix(in oklab, var(--border) 75%, var(--primary) 25%);
      border-radius: 0.65rem;
      background: color-mix(in oklab, var(--card) 95%, transparent);
    }

    #paper-typing-lab .manuscript.is-pdf .section.is-active {
      border-left-color: var(--primary);
      background: color-mix(in oklab, var(--primary) 7%, var(--card));
    }

    #paper-typing-lab .manuscript.is-pdf .section-heading {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    #paper-typing-lab .manuscript.is-pdf .section-body {
      line-height: 1.68;
    }

    #paper-typing-lab .manuscript.is-pdf .section[data-kind=&quot;abstract&quot;] {
      background: color-mix(in oklab, var(--secondary) 8%, var(--card));
    }

    #paper-typing-lab .manuscript.is-pdf .section[data-kind=&quot;abstract&quot;] .section-body {
      font-style: italic;
    }

    #paper-typing-lab .manuscript.is-pdf .section[data-kind=&quot;references&quot;] .section-body {
      font-size: 0.92rem;
      line-height: 1.48;
    }

    #paper-typing-lab .cursor {
      display: inline-block;
      animation: paper-typing-blink 1s steps(2, end) infinite;
    }

    #paper-typing-lab .keyboard-panel {
      display: grid;
      gap: 0.75rem;
      align-content: start;
    }

    #paper-typing-lab .keyboard-grid {
      display: grid;
      gap: 0.4rem;
      grid-template-columns: repeat(10, minmax(0, 1fr));
    }

    #paper-typing-lab .keycap {
      padding: 0.55rem 0.35rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      text-align: center;
      font: inherit;
      color: inherit;
      background: color-mix(in oklab, var(--card) 78%, transparent);
      transition:
        background 160ms ease,
        color 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
      user-select: none;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    #paper-typing-lab .keycap.is-live {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    #paper-typing-lab .keycap.wide-2 {
      grid-column: span 2;
    }

    #paper-typing-lab .keycap.wide-3 {
      grid-column: span 3;
    }

    #paper-typing-lab .keycap.wide-4 {
      grid-column: span 4;
    }

    #paper-typing-lab .stroke-feed {
      display: grid;
      gap: 0.4rem;
    }

    #paper-typing-lab .stroke-line {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
    }

    #paper-typing-lab .progress-track {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 0.45rem;
    }

    #paper-typing-lab .storm-canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #paper-typing-lab .storm-canvas.is-active {
      opacity: 1;
    }

    #paper-typing-lab .progress-bar {
      height: 0.5rem;
      border-radius: 999px;
      overflow: hidden;
      background: var(--muted);
    }

    #paper-typing-lab .progress-bar &gt; span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 180ms linear;
    }

    #paper-typing-lab .status-line {
      min-height: 1.5rem;
    }

    #paper-typing-lab .status-stack {
      display: grid;
      gap: 0.1rem;
      min-width: 14rem;
      align-self: end;
    }

    #paper-typing-lab .status-stack .status-line {
      overflow-wrap: anywhere;
    }

    #paper-typing-lab .btn[disabled],
    #paper-typing-lab .btn.is-disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    #paper-typing-lab .file-btn {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    #paper-typing-lab .file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    @keyframes paper-typing-blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 760px) {
      #paper-typing-lab .manuscript {
        max-height: 62vh;
      }

      #paper-typing-lab .workspace {
        grid-template-columns: 1fr;
      }

      #paper-typing-lab .keyboard-grid {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #paper-typing-lab .cursor {
        animation: none;
      }
    }
  &lt;/style&gt;

  &lt;section class=&quot;lab-shell&quot; aria-label=&quot;typing manuscript simulation&quot;&gt;
    &lt;div class=&quot;toolbar&quot;&gt;

          &lt;i data-lucide=&quot;languages&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;span id=&quot;languageLabel&quot;&gt;EN&lt;/span&gt;

        &lt;button id=&quot;soundToggle&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;
          &lt;i data-lucide=&quot;volume-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;

        &lt;button id=&quot;stormToggle&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;
          &lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;

          &lt;i data-lucide=&quot;upload&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;span id=&quot;pdfButtonLabel&quot;&gt;Import PDF&lt;/span&gt;

      &lt;div class=&quot;toolbar-group&quot;&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;paper-typing-lab&#x27;);
      if (!root) return;

      let sectionDefs = [
        {
          key: &#x27;abstract&#x27;,
          name: { en: &#x27;Abstract&#x27;, zh: &#x27;摘要&#x27; },
          text: {
            en: &#x27;We present a kinetic manuscript interface that turns stochastic keyboard activity into a structured academic draft. Instead of treating typing as a silent input stream, the page exposes insertion, revision, citation, and section changes as visible stages in composition.&#x27;,
            zh: &#x27;我们提出一个把随机键盘活动转译为结构化学术草稿的动态论文界面。页面不把打字当作静默输入流，而是把插入、修订、引文和段落推进都显式展示为写作阶段。&#x27;,
          },
        },
        {
          key: &#x27;introduction&#x27;,
          name: { en: &#x27;Introduction&#x27;, zh: &#x27;引言&#x27; },
          text: {
            en: &#x27;Traditional writing interfaces assume linear intent. Here, arbitrary keystrokes become a drafting motor: each burst advances the outline, while small corrections and punctuation events make the editorial process legible. The result is a page that feels both playful and scholarly.&#x27;,
            zh: &#x27;传统写作界面默认线性意图。这里，任意按键会变成一种草稿推进器：每一次敲击都推动提纲前行，微小修正和标点事件则让编辑过程变得可见。页面因此同时带着游戏感和论文感。&#x27;,
          },
        },
        {
          key: &#x27;methods&#x27;,
          name: { en: &#x27;Methods&#x27;, zh: &#x27;方法&#x27; },
          text: {
            en: &#x27;Randomized key events are mapped to writing operators. Letters nudge the current paragraph forward, punctuation triggers citations or sentence boundaries, Enter advances the manuscript rhythm, and Backspace introduces revision. Tempo controls the cadence, and chaos controls the chance of detours.&#x27;,
            zh: &#x27;随机键事件被映射为写作操作。字母推进当前段落，标点触发引文或句末，Enter 推进章节节奏，Backspace 引入修订。节奏控制打字速度，混沌控制偏离和回撤的概率。&#x27;,
          },
        },
        {
          key: &#x27;results&#x27;,
          name: { en: &#x27;Results&#x27;, zh: &#x27;结果&#x27; },
          text: {

          audioMaster.connect(audioContext.destination);

        if (audioContext.state === &#x27;suspended&#x27;) {
          audioContext.resume().catch(() =&gt; {});
        }
        return audioContext;

        const oscillator = context.createOscillator();

      function pickWeighted(items) {

      const pdfJsUrl = &#x27;https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs&#x27;;

        const flush = () =&gt; {
          if (!chunk.length) return;
          const text = chunk.join(&#x27;\n\n&#x27;);
          sections.push({
            key: `pdf-${startPage}-${endPage}`,
            name: sectionNameForPages(startPage, endPage),

          chunkLength = 0;

        pageTexts.forEach((rawText, index) =&gt; {

        if (hasMetadataTitle) {
          const lowerTitle = title.toLowerCase();
          const matchedIndex = records.findIndex((record) =&gt; {
            const line = record.text.toLowerCase();
            return lowerTitle.includes(line) || line.includes(lowerTitle);
          });
          if (matchedIndex &gt;= 0) titleIndex = matchedIndex;
        }

        const authorLines = [];
        let cursor = Math.max(0, titleIndex + 1);
        while (cursor &lt; records.length &amp;&amp; looksLikeAuthorLine(records[cursor].text, authorLines.length)) {
          authorLines.push(records[cursor].text);
          cursor += 1;
        }

        const sections = [];
        let current = null;
        let leadingLines = [];
        let sectionCount = 0;

        const makeSection = (kind, lines, name) =&gt; {
          const text = formatPdfSectionLines(lines, kind);
          if (!text) return null;
          sectionCount += 1;
          return {
            key: `${kind}-${sectionCount}`,
            kind,
            name: name || pdfLabel(kind),
            text: { en: text, zh: text },
          };
        };

        const flushCurrent = () =&gt; {
          if (!current) return;
          const section = makeSection(current.kind, current.lines, current.name);
          if (section) sections.push(section);
          current = null;
        };

        records.slice(cursor).forEach((record) =&gt; {
          const heading = detectPdfHeading(record.text);
          if (heading) {
            if (!current &amp;&amp; leadingLines.length) {
              const leadKind = leadingLines.join(&#x27; &#x27;).length &lt; 2400 ? &#x27;abstract&#x27; : &#x27;body&#x27;;
              const leading = makeSection(leadKind, leadingLines, pdfLabel(leadKind));
              if (leading) sections.push(leading);
              leadingLines = [];
            }
            flushCurrent();
            current = { kind: heading.kind, name: heading.name, lines: [] };
            if (heading.remainder) current.lines.push(heading.remainder);
            return;
          }
          if (current) {
            current.lines.push(record.text);
          } else {
            leadingLines.push(record.text);
          }
        });

        flushCurrent();
        if (leadingLines.length &amp;&amp; !sections.length) {
          const fallback = makeSection(&#x27;body&#x27;, leadingLines, pdfLabel(&#x27;body&#x27;));
          if (fallback) sections.push(fallback);
        }

        return {
          title,
          authors: authorLines.join(&#x27;\n&#x27;),
          sections,
          pageCount: pageTexts.length,
        };
      }

      async function loadPdfJs() {
        if (!pdfJsPromise) {
          pdfJsPromise = import(pdfJsUrl).then((pdfjs) =&gt; {
            pdfjs.GlobalWorkerOptions.workerSrc = pdfJsWorkerUrl;
            return pdfjs;
          });
        }
        return pdfJsPromise;
      }

      function pickPdfFile(fileList) {
        return Array.from(fileList || []).find((file) =&gt;
          file &amp;&amp; (file.type === &#x27;application/pdf&#x27; || /\.pdf$/i.test(file.name || &#x27;&#x27;))
        );
      }

      function textContentToLines(content) {
        const rows = [];
        content.items.forEach((item) =&gt; {
          const text = String(item.str || &#x27;&#x27;).trim();
          if (!text) return;
          const transform = item.transform || [];
          const x = Number(transform[4] || 0);
          const y = Number(transform[5] || 0);
          let row = rows.find((candidate) =&gt; Math.abs(candidate.y - y) &lt; 2.4);
          if (!row) {
            row = { y, items: [] };
            rows.push(row);
          }
          row.items.push({ x, text });
        });

        return rows
          .sort((a, b) =&gt; b.y - a.y)
          .map((row) =&gt;
            row.items
              .sort((a, b) =&gt; a.x - b.x)
              .map((item) =&gt; item.text)
              .join(&#x27; &#x27;)
              .replace(/\s+/g, &#x27; &#x27;)
              .trim()
          )
          .filter(Boolean)
          .join(&#x27;\n&#x27;);
      }

      async function importPdf(file) {
        if (!file) return;
        state.sourceStatus = &#x27;loading&#x27;;
        state.sourceName = file.name;
        els.pdfButton.classList.add(&#x27;is-disabled&#x27;);
        els.pdfButton.setAttribute(&#x27;aria-disabled&#x27;, &#x27;true&#x27;);
        els.pdfButton.setAttribute(&#x27;aria-busy&#x27;, &#x27;true&#x27;);
        els.pdfInput.disabled = true;
        updateSourceLabel();

        try {
          const pdfjs = await loadPdfJs();
          const data = await file.arrayBuffer();
          const pdf = await pdfjs.getDocument({ data }).promise;
          const metadata = await pdf.getMetadata().catch(() =&gt; null);
          const pageTexts = [];

          for (let pageNumber = 1; pageNumber &lt;= pdf.numPages; pageNumber += 1) {
            const page = await pdf.getPage(pageNumber);
            const content = await page.getTextContent();
            pageTexts.push(textContentToLines(content));
          }

          if (pdf.destroy) {
            await pdf.destroy();
          }

          const document = buildStructuredPdfDocument(
            file,
            metadata &amp;&amp; metadata.info ? metadata.info.Title : &#x27;&#x27;,
            pageTexts
          );
          if (!document.sections.length) throw new Error(&#x27;No extractable text in this PDF.&#x27;);

          setManuscript({
            kind: &#x27;pdf&#x27;,
            name: file.name,
            title: document.title,
            authors: document.authors,
            pageCount: document.pageCount,
            sections: document.sections,
          });
        } catch (error) {
          console.error(error);
          state.sourceStatus = &#x27;error&#x27;;
          updateSourceLabel();
        } finally {
          els.pdfButton.classList.remove(&#x27;is-disabled&#x27;);
          els.pdfButton.setAttribute(&#x27;aria-disabled&#x27;, &#x27;false&#x27;);
          els.pdfButton.setAttribute(&#x27;aria-busy&#x27;, &#x27;false&#x27;);
          els.pdfInput.disabled = false;
          els.pdfInput.value = &#x27;&#x27;;
        }
      }

      function renderAll() {
        const locale = currentLocale();
        const title = manuscriptTitle();
        const total = sectionDefs.length + 1;
        const done = state.titleProgress + state.sectionProgress.reduce((sum, value) =&gt; sum + value, 0);
        const percent = Math.round((done / total) * 100);
        const activeIndex = Math.min(state.activeIndex, sectionDefs.length - 1);
        const phaseKey = state.finished
          ? &#x27;proofread&#x27;
          : state.titleProgress &lt; 1
            ? &#x27;title&#x27;
            : sectionDefs[activeIndex].key;
        const isPdf = state.sourceKind === &#x27;pdf&#x27;;

        els.manuscript.classList.toggle(&#x27;is-pdf&#x27;, isPdf);
        els.paperMeta.hidden = !isPdf;
        if (isPdf) {
          els.paperAuthors.hidden = !state.paperAuthors;
          els.paperAuthors.textContent = state.paperAuthors
            ? `${locale.ui.paperAuthors}: ${state.paperAuthors}`
            : &#x27;&#x27;;
          els.paperMetaNote.textContent = state.sourcePageCount
            ? `${locale.ui.paperImported} · ${state.sourcePageCount} ${locale.ui.paperPages}`
            : locale.ui.paperImported;
        } else {
          els.paperAuthors.textContent = &#x27;&#x27;;
          els.paperMetaNote.textContent = &#x27;&#x27;;
        }
        els.paperTitle.textContent = sliceByProgress(title, state.titleProgress);
        els.progressValue.textContent = `${percent}%`;
        els.progressFill.style.width = `${percent}%`;
        const phaseName = locale.ui.phaseNames[phaseKey] || (sectionDefs[activeIndex] ? sectionName(sectionDefs[activeIndex]) : phaseKey);
        els.phaseLabel.textContent = `${locale.ui.phasePrefix}${phaseName}`;
        updateSourceLabel();

        sectionNodes.forEach(({ wrap, body, label, section }, index) =&gt; {
          const progress = state.sectionProgress[index];
          const visible = sliceByProgress(sectionText(section), progress);
          const doneSection = progress &gt;= 1;
          const active = index === activeIndex &amp;&amp; !state.finished;
          wrap.classList.toggle(&#x27;is-active&#x27;, active);
          wrap.classList.toggle(&#x27;is-done&#x27;, doneSection);
          label.textContent = sectionName(section);

          body.textContent = &#x27;&#x27;;
          body.appendChild(document.createTextNode(visible));
          if (active &amp;&amp; visible.length &lt; sectionText(section).length) {
            const cursor = document.createElement(&#x27;span&#x27;);
            cursor.className = &#x27;cursor&#x27;;
            cursor.textContent = &#x27;▍&#x27;;
            body.appendChild(cursor);
          }
        });

        els.strokeFeed.textContent = &#x27;&#x27;;
        state.history.forEach((item) =&gt; {
          const line = document.createElement(&#x27;li&#x27;);
          line.className = &#x27;stroke-line&#x27;;
          const key = document.createElement(&#x27;span&#x27;);
          const section = sectionByKey.get(item.sectionKey);
          if (item.type === &#x27;title&#x27;) {
            key.textContent = state.language === &#x27;en&#x27; ? &#x27;TITLE&#x27; : &#x27;标题&#x27;;
          } else if (item.type === &#x27;revise&#x27;) {
            key.textContent = state.language === &#x27;en&#x27; ? &#x27;EDIT&#x27; : &#x27;修订&#x27;;
          } else if (section) {
            key.textContent = state.language === &#x27;en&#x27; ? sectionName(section).toUpperCase() : sectionName(section);
          } else {
            key.textContent = item.sectionKey.toUpperCase();
          }
          const detail = document.createElement(&#x27;span&#x27;);
          detail.textContent = formatHistory(item);
          line.appendChild(key);
          line.appendChild(detail);
          els.strokeFeed.appendChild(line);
        });

        queueFollowActive(activeIndex);
      }

      function step(timestamp) {
        if (!step.last) step.last = timestamp;
        const delta = timestamp - step.last;
        step.last = timestamp;
        decayFlow(delta);
        updateSourceLabel();
        updateStorm(delta);

        if (state.running) {
          const interval = Math.max(46, 5200 / (state.tempo * intervalMultiplier()));
          state.accumulator += delta;
          while (state.accumulator &gt;= interval) {
            state.accumulator -= interval;
            emitStroke();
            if (state.finished) break;
          }
        }

        if (flushStrokeQueue() || renderQueued) {
          renderQueued = false;
          renderAll();
        }

        requestAnimationFrame(step);
      }

      els.toggleRun.addEventListener(&#x27;click&#x27;, () =&gt; {
        ensureAudioContext();
        state.running = !state.running;
        syncRunButton();
      });

      els.resetRun.addEventListener(&#x27;click&#x27;, () =&gt; {
        ensureAudioContext();
        resetDraft();
      });

      els.languageToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
        ensureAudioContext();
        state.language = state.language === &#x27;en&#x27; ? &#x27;zh&#x27; : &#x27;en&#x27;;
        updateStaticLabels();
        syncRunButton();
        renderAll();
      });

      els.soundToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
        state.soundEnabled = !state.soundEnabled;
        if (state.soundEnabled) ensureAudioContext();
        syncSoundButton();
      });

      els.stormToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
        state.stormEnabled = !state.stormEnabled;
        state.stormAccumulator = 0;
        syncStormButton();
        if (!state.stormEnabled) {
          clearStormCanvas();
        }
      });

      els.pdfButton.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key !== &#x27;Enter&#x27; &amp;&amp; event.key !== &#x27; &#x27;) return;
        event.preventDefault();
        ensureAudioContext();
        els.pdfInput.click();
      });

      els.pdfInput.addEventListener(&#x27;change&#x27;, (event) =&gt; {
        const file = pickPdfFile(event.target.files);
        importPdf(file);
      });

      els.pdfInput.addEventListener(&#x27;click&#x27;, () =&gt; {
        ensureAudioContext();
      });

      [&#x27;dragenter&#x27;, &#x27;dragover&#x27;].forEach((name) =&gt; {
        root.addEventListener(name, (event) =&gt; {
          event.preventDefault();
          if (els.shell) els.shell.classList.add(&#x27;is-dragging&#x27;);
        });
      });

      root.addEventListener(&#x27;dragleave&#x27;, (event) =&gt; {
        if (event.relatedTarget &amp;&amp; root.contains(event.relatedTarget)) return;
        if (els.shell) els.shell.classList.remove(&#x27;is-dragging&#x27;);
      });

      root.addEventListener(&#x27;drop&#x27;, (event) =&gt; {
        event.preventDefault();
        if (els.shell) els.shell.classList.remove(&#x27;is-dragging&#x27;);
        importPdf(pickPdfFile(event.dataTransfer &amp;&amp; event.dataTransfer.files));
      });

      window.addEventListener(&#x27;paste&#x27;, (event) =&gt; {
        const file = pickPdfFile(event.clipboardData &amp;&amp; event.clipboardData.files);
        if (!file) return;
        event.preventDefault();
        importPdf(file);
      });

      els.tempo.addEventListener(&#x27;input&#x27;, (event) =&gt; {
        state.tempo = Number(event.target.value);
        els.tempoValue.textContent = String(state.tempo);
      });

      els.chaos.addEventListener(&#x27;input&#x27;, (event) =&gt; {
        state.chaos = Number(event.target.value) / 100;
        els.chaosValue.textContent = String(Math.round(state.chaos * 100));
      });

      window.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (event.target &amp;&amp; event.target.closest &amp;&amp; event.target.closest(&#x27;button, input, label&#x27;)) return;
        if (event.key === &#x27; &#x27; || event.key === &#x27;Tab&#x27; || event.key === &#x27;Enter&#x27; || event.key === &#x27;Backspace&#x27;) {
          event.preventDefault();
        }
        ensureAudioContext();
        emitStroke(event.key === &#x27; &#x27; ? &#x27;Space&#x27; : event.key, defaultInputProfile());
      });

      window.addEventListener(&#x27;resize&#x27;, () =&gt; {
        resizeStormCanvas();
      });

      initKeyboard();
      initManuscript();
      state.running = false;
      updateStaticLabels();
      syncRunButton();
      syncSoundButton();
      syncStormButton();
      resizeStormCanvas();
      renderAll();

      if (state.reduced) {
        state.running = false;
        syncRunButton();
      }

      requestAnimationFrame(step);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
