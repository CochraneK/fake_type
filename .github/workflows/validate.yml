name: Validate static app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check qa.js
          node --check sw.js
          node --check playwright.config.js
          node --check tests/smoke.spec.js

      - name: Validate JSON metadata
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Check HTML integrity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          if '<iframe' in html.lower() or 'srcdoc=' in html.lower():
              raise SystemExit('Legacy iframe/srcdoc architecture reintroduced')
          PY

      - name: Check required files and references
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f enhancements.css
          test -f qa.css
          test -f app.js
          test -f enhancements.js
          test -f qa.js
          test -f manifest.webmanifest
          test -f favicon.svg
          test -f sw.js
          test -f package.json
          test -f playwright.config.js
          test -f tests/smoke.spec.js
          grep -q 'href="styles.css"' index.html
          grep -q 'href="enhancements.css"' index.html
          grep -q 'href="qa.css"' index.html
          grep -q 'href="manifest.webmanifest"' index.html
          grep -q 'href="favicon.svg"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'src="enhancements.js"' index.html
          grep -q 'src="qa.js"' index.html
          grep -q "'./qa.css'" sw.js
          grep -q "'./qa.js'" sw.js
