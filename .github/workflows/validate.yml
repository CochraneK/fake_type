name: Validate static app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check required files and references
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
