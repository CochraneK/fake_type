name: Feature request
description: Suggest a focused improvement to FakeType
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need before describing the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain how the feature should behave from the user's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Typing engine
        - Text / Markdown import
        - PDF import
        - Mobile / touch
        - Cinema / Chaos / Storm
        - Accessibility
        - PWA / offline
        - Testing / engineering
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: I considered the project's zero-build, framework-free approach.
        - label: This does not require uploading users' manuscript content to a server.
