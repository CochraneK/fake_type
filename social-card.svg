<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FakeType — Mash the keyboard. Write anything.</title>
  <desc id="desc">A paper-like FakeType social card with academic typography and kinetic writing motifs.</desc>
